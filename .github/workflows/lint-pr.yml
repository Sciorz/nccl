# .github/workflows/lint-pr.yml
# This CI workflow checks only the files changed in a Pull Request.

name: PR Code Quality Check

on:
  pull_request:
    branches: [ main, master ]

jobs:
  lint-changed-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **/*.cpp
          **/*.hpp
          **/*.cu
          **/*.cuh

    - name: List changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy cmake

    - name: Configure Build (to generate compile_commands.json)
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..

    - name: Run clang-format check
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        clang-format --dry-run -Werror ${{ steps.changed-files.outputs.all_changed_files }}

    - name: Run clang-tidy check
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        clang-tidy -p build/ ${{ steps.changed-files.outputs.all_changed_files }}
