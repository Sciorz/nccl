# .github/workflows/lint.yml
# Minimal clang-format & clang-tidy workflow (diff-only on PR, using CUDA container)

name: Lint (clang-format & clang-tidy)

on:
  pull_request: # No branch filter, triggers on all PRs
  push:

# Needed for reviewdog to comment on PRs
permissions:
  contents: read
  pull-requests: write

jobs:
  # Diff-only linting on PR using reviewdog
  lint-pr-check:
    name: Lint and Static Analysis (reviewdog)
    runs-on: ubuntu-latest
    # Run the entire job in a container with a pre-installed CUDA toolkit
    container:
      image: nvidia/cuda:12.1.1-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate compilation database (for clang-tidy)
        run: |
          # The container already has build-essentials and nvcc. We just need bear.
          apt-get update
          apt-get install -y bear
          mkdir -p build
          # The build should find nvcc from the container's environment.
          bear -o build/compile_commands.json -- make -j src.build NVCC_GENCODE="-gencode=arch=compute_70,code=sm_70" || echo "Bear command finished. A partial compile_commands.json may have been generated."

      # - name: clang-format检查 (diff-only)
      #   uses: jidicula/clang-format-action@v4.11.0
      #   with:
      #     clang-format-version: '16'
      #     check-path: 'src'
      #     fallback-style: 'Google'
      #     exclude-regex: 'build/'

      - name: clang-tidy检查 (diff-only)
        uses: ZedThree/clang-tidy-review@v0.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          build_dir: build
          clang_tidy_version: '16'
          split_workflow: false
          lgtm_comment_body: ''
          exclude: 'build/*'
